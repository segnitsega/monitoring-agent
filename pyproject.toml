[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoring-agent"
version = "1.0.0"
description = "Cross-platform server health & backup monitoring agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "segnitsega", email = "segnitsega6@gmail.com" }]
dependencies = [
    "psutil>=5.9",
    "requests>=2.28",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
dev = ["pytest>=7.4", "pyinstaller>=6.0"]

[project.scripts]
monitoring-agent = "agent.main:main"

[tool.setuptools]
packages = [
    "agent",
    "agent.collectors",
    "agent.transport",
    "agent.service",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
